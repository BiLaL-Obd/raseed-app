<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0d17" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="icons/favicon-32.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Raseed" />
    <meta name="format-detection" content="telephone=no" />
    <title>Raseed — رصيد</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link href="fonts/fonts.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <header class="top" id="top">
      <button class="icon-btn hidden" id="backBtn" aria-label="back"></button>
      <svg class="logo" id="logoTop" viewBox="0 0 48 48"></svg>
      <div style="flex: 1; min-width: 0">
        <small id="hello"></small>
        <h1 id="title"></h1>
      </div>
      <button class="icon-btn" id="bellBtn" aria-label="alerts"></button>
      <button class="icon-btn" id="setBtn" aria-label="menu"></button>
    </header>
    <main id="view"></main>
    <button class="fab" id="fab" aria-label="add"></button>
    <button class="to-top" id="toTop" aria-label="top"></button>
    <nav class="bottom" id="nav"></nav>
    <div class="overlay" id="ov"></div>
    <div class="sheet" id="sheet">
      <div class="grab"></div>
      <button class="sheet-x" id="sheetX" aria-label="close"></button>
      <div id="sheetBody"></div>
    </div>
    <div class="page hidden" id="page">
      <div class="page-top">
        <button class="icon-btn" id="pgBack" aria-label="back"></button>
        <h2 id="pgTitle"></h2>
        <button class="pg-save" id="pgSave"></button>
      </div>
      <div class="page-body" id="pgBody"></div>
    </div>
    <div class="toast" id="toast"></div>
    <div class="lock hidden" id="lock"></div>
    <input type="file" id="fileIn" accept="*/*" class="hidden" />

    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
