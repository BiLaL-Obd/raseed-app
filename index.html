<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d17">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Raseed">
<meta name="format-detection" content="telephone=no">
<title>Raseed — رصيد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="fonts/fonts.css" rel="stylesheet">
<style>
:root{
  --bg:#0b0d17; --bg2:#121527; --card:#171a2e; --card2:#1e2240; --line:#272b4a;
  --text:#eef0ff; --muted:#8d92b8; --primary:#7c5cff; --primary2:#4cc9f0;
  --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --shadow:0 10px 30px rgba(0,0,0,.35);
  --r:18px; --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
}
[data-theme=light]{
  --bg:#f3f4fb; --bg2:#ffffff; --card:#ffffff; --card2:#f1f2fa; --line:#e3e5f2;
  --text:#14162b; --muted:#6b7092; --shadow:0 8px 24px rgba(30,30,80,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Cairo","Segoe UI",Tahoma,system-ui,sans-serif;font-size:15px}
body{overscroll-behavior-y:none;min-height:100vh;padding-bottom:calc(86px + var(--safeB))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none!important}
/* scroll */
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--primary) 70%,transparent) transparent}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--primary),var(--primary2));border-radius:10px}
.svc-row,.chips{scroll-snap-type:x proximity;scroll-behavior:smooth}
.svc-card,.chips button{scroll-snap-align:start}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.anim>*,.anim #lst>*,.anim #upc>*,.anim .grid>*,.anim .notes>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
.anim>*:nth-child(2),.anim #lst>*:nth-child(2),.anim .notes>*:nth-child(2){animation-delay:.04s}
.anim>*:nth-child(3),.anim #lst>*:nth-child(3),.anim .notes>*:nth-child(3){animation-delay:.08s}
.anim>*:nth-child(4),.anim #lst>*:nth-child(4),.anim .notes>*:nth-child(4){animation-delay:.12s}
.anim>*:nth-child(5),.anim #lst>*:nth-child(5),.anim .notes>*:nth-child(5){animation-delay:.16s}
.anim>*:nth-child(n+6),.anim #lst>*:nth-child(n+6),.anim .notes>*:nth-child(n+6){animation-delay:.2s}
.card,.item,.stat,.svc-card,.qa button,.mini-acts>*{transition:transform .12s ease}
.card:active,.item:active,.svc-card:active,.qa button:active,.mini-acts>*:active{transform:scale(.97)}
.to-top{position:fixed;bottom:calc(150px + var(--safeB));inset-inline-end:26px;z-index:24;width:42px;height:42px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);pointer-events:none;transition:.25s}
.to-top.on{opacity:1;transform:none;pointer-events:auto}
.to-top svg{width:20px;height:20px}
/* header */
.top{position:sticky;top:0;z-index:20;padding:calc(12px + var(--safeT)) 18px 10px;background:linear-gradient(var(--bg) 70%,transparent);display:flex;align-items:center;gap:10px;transition:background .25s,box-shadow .25s,padding .25s}
.top.scrolled{background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 8px 24px rgba(0,0,0,.16);padding-bottom:8px}
.top.scrolled h1{font-size:18px}
.top h1{transition:font-size .25s}
.logo{width:40px;height:40px;border-radius:13px;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.16),0 6px 18px rgba(76,201,240,.25)}
.top h1{font-size:21px;margin:0;font-weight:800;flex:1;letter-spacing:-.3px}
.top small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.icon-btn{width:42px;height:42px;border-radius:14px;background:var(--card);display:grid;place-items:center;position:relative;border:1px solid var(--line)}
.icon-btn svg{width:21px;height:21px}
.badge{position:absolute;top:-4px;inset-inline-end:-4px;background:var(--bad);color:#fff;font-size:11px;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;font-weight:700;padding:0 5px}
main{--gut:16px;padding:4px var(--gut) 80px;max-width:640px;margin:0 auto;overflow-x:clip}
/* bottom nav */
nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:color-mix(in srgb,var(--bg2) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px calc(8px + var(--safeB))}
nav.bottom button{flex:1;max-width:96px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--muted);padding:6px 2px;border-radius:14px;white-space:nowrap;transition:background .2s,color .2s}
nav.bottom{justify-content:center!important;gap:2px}
nav.bottom button svg{width:22px;height:22px;transition:transform .2s}
nav.bottom button.on svg{transform:translateY(-1px) scale(1.08)}
nav.bottom button.on{color:var(--primary);background:color-mix(in srgb,var(--primary) 13%,transparent)}
.fab{position:fixed;bottom:calc(84px + var(--safeB));inset-inline-end:18px;z-index:25;width:58px;height:58px;border-radius:20px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;display:grid;place-items:center;box-shadow:0 12px 28px rgba(124,92,255,.45)}
.fab svg{width:28px;height:28px}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.hero{border-radius:24px;padding:20px;color:#fff;background:linear-gradient(135deg,#7c5cff 0%,#4f46e5 45%,#4cc9f0 100%);position:relative;overflow:hidden;margin-bottom:14px;box-shadow:0 16px 34px rgba(79,70,229,.35)}
.hero:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12);top:-90px;inset-inline-end:-60px}
.hero .lbl{opacity:.85;font-weight:600;font-size:13px}
.hero .big{font-size:34px;font-weight:800;letter-spacing:-.5px;line-height:1.3;direction:ltr;text-align:start}
.hero .row{display:flex;gap:10px;margin-top:12px;position:relative;z-index:1}
.hero .pill{flex:1;background:rgba(255,255,255,.16);border-radius:14px;padding:8px 10px}
.hero .pill b{display:block;font-size:16px;direction:ltr;text-align:start}
.hero .pill span{font-size:11.5px;opacity:.9;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:center}
.stat .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.stat .ic svg{width:20px;height:20px}
.stat b{font-size:19px;display:block;line-height:1.2}
.stat span{color:var(--muted);font-size:12px;font-weight:600}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px}
.sec-title h3{margin:0;font-size:16px;font-weight:800}
.link{color:var(--primary);font-weight:700;font-size:13px}
.svc-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin:0 calc(-1 * var(--gut));padding-inline:var(--gut);scrollbar-width:none}
.svc-row::-webkit-scrollbar{display:none}
.svc-card{min-width:158px;border-radius:20px;padding:14px;color:#fff;position:relative;overflow:hidden;flex:none;text-align:start}
.svc-card:after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.13);bottom:-50px;inset-inline-end:-30px}
.svc-card .nm{font-weight:800;font-size:16px}
.svc-card .n{font-size:26px;font-weight:800;line-height:1.2}
.svc-card .s{font-size:11.5px;opacity:.92;font-weight:600}
.svc-card.add{background:transparent;border:2px dashed var(--line);color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:120px;font-weight:800}
.svc-card.add svg{width:30px;height:30px}
.svc-card.add:after{display:none}
.svc-card .end{margin-top:8px;font-size:11.5px;background:rgba(0,0,0,.2);display:inline-block;padding:3px 8px;border-radius:9px;font-weight:700}
/* list items */
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px;text-align:start;width:100%}
.av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;flex:none}
.item .mid{flex:1;min-width:0}
.item .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .st{color:var(--muted);font-size:12.5px;font-weight:600;margin-top:1px}
.item .end{text-align:end;flex:none}
.item .amt{font-weight:800;direction:ltr}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.c-ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.c-warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.c-bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.c-mut{background:var(--card2);color:var(--muted)}
.bar{height:7px;background:var(--card2);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:6px}
/* filters */
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;padding:8px;border-radius:11px;font-weight:700;color:var(--muted);font-size:14px}
.seg button.on{background:var(--primary);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 calc(-1 * var(--gut)) 12px;padding:0 var(--gut);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13px;white-space:nowrap;color:var(--muted)}
.chips button.on{color:#fff;border-color:transparent}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px;margin-bottom:12px}
.search svg{width:18px;height:18px;color:var(--muted)}
.search input{flex:1;border:0;background:none;padding:11px 0;outline:none;font-size:16px}
.empty{text-align:center;color:var(--muted);padding:34px 10px;font-weight:600}
.empty svg{width:54px;height:54px;opacity:.5;margin-bottom:6px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px}
.qa button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:700}
.qa .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center}
.qa svg{width:19px;height:19px}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(5,6,15,.55);backdrop-filter:blur(3px);z-index:56;opacity:0;pointer-events:none;transition:.2s}
.overlay.on{opacity:1;pointer-events:auto}
.sheet{overflow-x:hidden;overscroll-behavior:contain;position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--bg2);border-radius:26px 26px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1);padding:8px 18px calc(22px + var(--safeB));max-width:640px;margin:0 auto}
.sheet.on{transform:none}
.sheet-x{position:absolute;top:12px;inset-inline-end:14px;width:34px;height:34px;border-radius:11px;background:var(--card);display:grid;place-items:center;color:var(--muted)}
.sheet-x svg{width:18px;height:18px}
.sheet .grab{width:44px;height:5px;border-radius:4px;background:var(--line);margin:4px auto 10px}
.sheet h2{margin:0 0 14px;padding-inline-end:40px;font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px}
.f{margin-bottom:12px}
.f label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
.f input,.f select,.f textarea{font-size:16px;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:11px 12px;outline:none;transition:border .15s}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--primary)}
.f textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tog{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:10px 12px;font-weight:700}
.sw{width:46px;height:27px;border-radius:20px;background:var(--line);position:relative;transition:.2s;flex:none}
.sw:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ok)}
.sw.on:after{inset-inline-start:22px}
.btn{width:100%;padding:13px;border-radius:15px;font-weight:800;font-size:15.5px;background:linear-gradient(135deg,var(--primary),#5b47e0);color:#fff;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.btn svg{width:19px;height:19px}
.btns{display:flex;gap:8px}
.btns .btn{flex:1}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-weight:600}
.kv span{color:var(--muted)}
.kv:last-child{border:0}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:34px;height:34px;border-radius:11px;border:3px solid transparent}
.colors button.on{border-color:var(--text)}
.toast{position:fixed;top:calc(16px + var(--safeT));left:50%;transform:translate(-50%,-220%);opacity:0;visibility:hidden;z-index:90;background:var(--text);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:700;transition:.3s;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1;visibility:visible}
.mini-acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.mini-acts button,.mini-acts a{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:5px;padding:8px 6px;border-radius:11px;background:var(--card2);font-weight:700;font-size:12.5px;text-decoration:none;color:var(--text)}
.mini-acts svg{width:16px;height:16px}
.wa{color:#25d366!important}
.cat-bar{display:flex;align-items:center;gap:10px;margin:8px 0;font-weight:600;font-size:13px}
.cat-bar .nm{width:92px;color:var(--muted)}
.cat-bar .tr{flex:1;height:10px;background:var(--card2);border-radius:6px;overflow:hidden}
.cat-bar .tr i{display:block;height:100%;border-radius:6px}
.cat-bar .v{min-width:66px;text-align:end;direction:ltr}
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.month-nav b{font-size:16px}
.ltr{direction:ltr;unicode-bidi:isolate}
.sub-hdr{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sub-meta{display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--muted);font-weight:600;flex-wrap:wrap}
.sub-meta b{color:var(--text)}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.hint{font-size:12px;color:var(--muted);font-weight:600;margin:-4px 2px 12px}
/* notes */
.notes{columns:2;column-gap:10px}
.nt{break-inside:avoid;display:block;width:100%;text-align:start;border-radius:18px;padding:13px;margin-bottom:10px;border:1px solid var(--line);position:relative;overflow:hidden}
.nt h4{margin:0 0 4px;font-size:15px;font-weight:800;padding-inline-end:16px}
.nt p{margin:0;font-size:13px;color:var(--muted);font-weight:600;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.nt .meta{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:11px;color:var(--muted);font-weight:700;gap:6px;flex-wrap:wrap}
.nt .pin{position:absolute;top:10px;inset-inline-end:10px;font-size:13px}
/* lock */
.lock{position:fixed;inset:0;z-index:55;overflow-y:auto;background:radial-gradient(90% 55% at 85% 0%,color-mix(in srgb,var(--primary2) 30%,transparent),transparent 70%),radial-gradient(90% 60% at 10% 10%,color-mix(in srgb,var(--primary) 38%,transparent),transparent 70%),var(--bg);display:flex;align-items:center;justify-content:center;padding:calc(20px + var(--safeT)) 20px calc(20px + var(--safeB))}
.lock-in{width:100%;max-width:340px;text-align:center}
.lock .logo{width:62px;height:62px;border-radius:20px;margin:0 auto 8px;display:block;box-shadow:0 0 0 1px rgba(255,255,255,.16),0 14px 36px rgba(76,201,240,.28)}
.lk-time{font-size:54px;font-weight:800;letter-spacing:-1px;line-height:1.05;direction:ltr}
.lk-date{color:var(--muted);font-weight:700;font-size:14px;margin:4px 0 26px}
.lk-co{font-size:12px;color:var(--muted);font-weight:700;margin-top:2px}
.fp{position:relative;width:118px;height:118px;border-radius:50%;margin:34px auto 16px;display:grid;place-items:center;background:color-mix(in srgb,var(--primary) 16%,var(--card));border:1.5px solid color-mix(in srgb,var(--primary) 55%,transparent);color:var(--text)}
.fp svg{width:56px;height:56px;color:var(--primary2)}
.fp:before,.fp:after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid color-mix(in srgb,var(--primary) 45%,transparent);animation:pulse 2.2s ease-out infinite}
.fp:after{animation-delay:1.1s}
@keyframes pulse{from{transform:scale(.9);opacity:.9}to{transform:scale(1.35);opacity:0}}
.fp:active{transform:scale(.95)}
.lk-link{color:var(--primary);font-weight:800;font-size:14px;margin-top:18px;padding:8px 14px;border-radius:12px}
.lk-hint{color:var(--muted);font-weight:700;font-size:14px}
.lock .brand{font-weight:800;font-size:20px}
.lock h2{font-size:17px;margin:18px 0 4px;font-weight:800}
.lock p{color:var(--muted);font-weight:600;font-size:13px;margin:0;min-height:20px}
.dots{display:flex;justify-content:center;gap:16px;margin:18px 0 28px;direction:ltr}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);transition:.15s}
.dots i.on{background:var(--primary);border-color:var(--primary);transform:scale(1.1)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.keys{display:grid;grid-template-columns:repeat(3,74px);gap:16px 26px;justify-content:center;margin:0 auto;direction:ltr}
.keys button{width:74px;height:74px;border-radius:50%;background:color-mix(in srgb,var(--text) 7%,transparent);border:1px solid color-mix(in srgb,var(--text) 10%,transparent);font-size:28px;font-weight:600;transition:transform .1s,background .1s;display:grid;place-items:center}
.keys button.ic-k{background:none;border:0}
.keys button:active{transform:scale(.9);background:color-mix(in srgb,var(--primary) 35%,transparent)}
.keys button.ghost{background:none;border:0;font-size:13px;color:var(--primary);font-weight:800}
.keys button svg{width:24px;height:24px}
.keys button:disabled{opacity:.35}
.code{font-size:26px;font-weight:800;letter-spacing:4px;text-align:center;direction:ltr;background:var(--card);border:2px dashed var(--primary);border-radius:16px;padding:16px;margin:10px 0}
.sec2{display:block;font-size:12px;font-weight:700;opacity:.8;direction:ltr;text-align:start}
.c-part{background:color-mix(in srgb,#3987e5 18%,transparent);color:#5aa0f0}
.banner{display:flex;gap:10px;align-items:center;background:color-mix(in srgb,var(--warn) 13%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));border-radius:16px;padding:11px 12px;margin-bottom:12px;font-weight:700;font-size:13px}
.banner button{margin-inline-start:auto;background:var(--warn);color:#111;border-radius:10px;padding:6px 10px;font-weight:800;font-size:12px;white-space:nowrap}
.camp{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.camp:last-child{border:0}
.camp .mid{flex:1;min-width:0}
.camp .t{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.camp .st{font-size:12px;color:var(--muted);font-weight:600}
.camp a,.camp .sent{padding:8px 12px;border-radius:11px;font-weight:800;font-size:12.5px;text-decoration:none;white-space:nowrap}
.camp a{background:#25d366;color:#fff}
.camp .sent{background:var(--card2);color:var(--ok)}
.rcpt{width:100%;border-radius:16px;border:1px solid var(--line);display:block;margin-bottom:10px}
/* charts */
:root{--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--grid:rgba(255,255,255,.07)}
[data-theme=light]{--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--grid:rgba(20,22,43,.08)}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .tip{position:absolute;top:0;pointer-events:none;background:var(--text);color:var(--bg);border-radius:12px;padding:8px 10px;font-size:12px;font-weight:700;line-height:1.6;box-shadow:var(--shadow);opacity:0;transition:opacity .15s;white-space:nowrap;z-index:2}
.chart .tip.on{opacity:1}
.legend{display:flex;gap:14px;font-size:12px;font-weight:700;color:var(--muted);margin:2px 0 8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;font-weight:600}
.tbl th{color:var(--muted);font-weight:700;text-align:start;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 4px;border-bottom:1px dashed var(--line)}
.tbl td.n,.tbl th.n{text-align:end;direction:ltr}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi .stat{display:block}
.kpi .delta{font-size:11.5px;font-weight:800}
.hbar{margin:9px 0}
.hbar .top{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:4px}
.hbar .top span:last-child{direction:ltr}
.hbar .tr{height:9px;background:var(--card2);border-radius:6px;overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:4px}
.bio-btn{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 auto 16px;padding:10px 18px;border-radius:16px;background:color-mix(in srgb,var(--primary) 18%,transparent);color:var(--text);font-weight:800}
.bio-btn svg{width:22px;height:22px}
.money-in{display:grid;grid-template-columns:1fr auto;gap:6px}
.money-in select{width:auto!important;min-width:72px;font-weight:800;padding-inline:10px!important}
.conv{font-size:12px;color:var(--primary);font-weight:800;margin-top:5px}
.rb{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;background:linear-gradient(135deg,#ff9f5a,#ff5c8a);margin-inline-end:6px;vertical-align:middle;box-shadow:0 3px 10px rgba(255,92,138,.35)}
.rb svg{width:16px;height:16px;color:#fff}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;text-align:start;display:flex;flex-direction:column;gap:9px;font-weight:800;font-size:15px;transition:transform .12s}
.tile:active{transform:scale(.96)}
.tile small{display:block;color:var(--muted);font-weight:600;font-size:11.5px;margin-top:1px}
.ib{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.ib svg{width:23px;height:23px}
.tpl{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:10px}
.tpl .hd{display:flex;gap:10px;align-items:center}
.tpl .em{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:21px;background:var(--card2);flex:none}
.tpl .pv{background:color-mix(in srgb,#25d366 9%,var(--card2));border-radius:4px 14px 14px 14px;padding:10px 12px;margin-top:10px;font-size:13px;font-weight:600;white-space:pre-wrap;line-height:1.7}
[dir=rtl] .tpl .pv{border-radius:14px 4px 14px 14px}
.vars{width:100%;border-collapse:collapse;font-size:13px}
.vars td{padding:8px 4px;border-bottom:1px dashed var(--line);vertical-align:top;font-weight:600}
.vars code{background:color-mix(in srgb,var(--primary) 16%,transparent);color:var(--primary);padding:2px 7px;border-radius:7px;font-weight:800;direction:ltr;display:inline-block;font-size:12.5px}
.vars td:last-child{color:var(--muted)}
details.help{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
details.help summary{font-weight:800;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
details.help summary::-webkit-details-marker{display:none}
details.help summary:after{content:"▾";margin-inline-start:auto;color:var(--muted);transition:.2s}
details.help[open] summary:after{transform:rotate(180deg)}
.var-chips{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}
.var-chips button{background:color-mix(in srgb,var(--primary) 14%,transparent);color:var(--primary);border-radius:9px;padding:5px 9px;font-weight:800;font-size:12px;direction:ltr}
.svc-pg{display:flex;gap:12px;align-items:center}
.svc-pg .nums{display:flex;gap:14px;margin-top:4px;font-size:12px;color:var(--muted);font-weight:700;flex-wrap:wrap}
.svc-pg .nums b{color:var(--text)}
.ord{display:flex;flex-direction:column;gap:4px}
.ord button{width:30px;height:26px;border-radius:9px;background:var(--card2);display:grid;place-items:center}
.ord button svg{width:15px;height:15px}
.ios-hint{display:flex;gap:10px;align-items:center;background:color-mix(in srgb,var(--primary2) 14%,var(--card));border:1px solid color-mix(in srgb,var(--primary2) 40%,var(--line));border-radius:16px;padding:11px 12px;margin-bottom:12px;font-weight:700;font-size:13px;line-height:1.6}
.ios-hint svg{width:22px;height:22px;flex:none;color:var(--primary2)}
.ios-hint button{margin-inline-start:auto;color:var(--muted);font-size:18px;padding:0 4px}
.note{background:color-mix(in srgb,var(--primary) 10%,transparent);border-radius:13px;padding:10px 12px;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:12px}
@media (min-width:700px){ .sheet{border-radius:26px;bottom:20px} .notes{columns:3} }
[dir=rtl] .hero .big,[dir=rtl] .hero .pill b,[dir=rtl] .stat b.ltr,[dir=rtl] .kpi b.ltr,[dir=rtl] .sec2{text-align:right}
@media (max-width:420px){
 main{--gut:14px}
 .top{padding-inline:16px}

 .icon-btn{width:40px;height:40px;border-radius:13px}
 .hero{padding:17px 16px;border-radius:22px}
 .hero .big{font-size:31px}
 .hero .row{gap:7px;margin-top:10px}
 .hero .pill{padding:8px 9px;border-radius:13px}
 .hero .pill b{font-size:15px}
 .grid{gap:8px}
 .stat{padding:11px 12px;gap:9px;border-radius:16px}
 .stat .ic{width:36px;height:36px;border-radius:11px}
 .stat b{font-size:18px}
 .qa{gap:7px}
 .qa button{padding:9px 2px;border-radius:15px}
 .qa .ic{width:34px;height:34px}
 .card,.item{border-radius:16px}
 .fab{width:54px;height:54px;border-radius:18px}
}
@media (max-width:360px){ .qa button{font-size:10.5px} .hero .big{font-size:29px} .hero .pill b{font-size:14px} nav.bottom button{font-size:9.5px} .row3{gap:5px} }

function alerts(){
  const out=[];const rd=num(S.settings.remindDays);
  for(const s of S.subs){const d=daysLeft(s.end);if(d<=rd&&d>=-7)out.push({kind:d<0?'bad':'warn',d,txt:t('subExpAlert',{name:cust(s.customerId).name,svc:svc(s.serviceId).name,when:whenTxt(s.end)}),sub:s.id})}
  for(const a of S.accounts){if(!a.end)continue;const d=daysLeft(a.end);if(d<=rd&&d>=-7)out.push({kind:d<0?'bad':'warn',d,txt:t('accExpAlert',{svc:svc(a.serviceId).name,acc:a.label,when:whenTxt(a.end)}),acc:a.id})}
  for(const n of S.notes){if(!n.remindAt)continue;const d=Math.round((parse(n.remindAt.slice(0,10))-parse(today()))/864e5);if(d<=0&&d>=-2)out.push({kind:'warn',d,txt:'📝 '+(n.title||(n.body||'').slice(0,40)),note:n.id})}
  for(const p of S.products){if(num(p.low)>0&&num(p.stock)<num(p.low))out.push({kind:'warn',d:0,txt:t('lowStockAlert',{name:p.name,n:p.stock}),prod:p.id})}
  return out.sort((a,b)=>a.d-b.d);
}

/* ============ NATIVE NOTIFICATIONS (Capacitor) ============ */
const Cap=()=>window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()?window.Capacitor.Plugins:null;
let notifT;
function scheduleNotifs(){clearTimeout(notifT);notifT=setTimeout(()=>{doSchedule();updateWidget()},800)}
async function doSchedule(){
  const C=Cap();if(!C||!C.LocalNotifications)return;const LN=C.LocalNotifications;
  try{
    const perm=await LN.checkPermissions();if(perm.display!=='granted')return;
    const pend=await LN.getPending();if(pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    const list=[];const now=new Date();const [hr,mn]=(S.settings.notifTime||'10:00').split(':').map(Number);const rd=num(S.settings.remindDays);
    const at=(dateStr,offset)=>{const d=parse(dateStr);d.setDate(d.getDate()-offset);d.setHours(hr,mn,0,0);return d};
    for(const n of S.notes){if(n.remindAt){const d=new Date(n.remindAt);push(d,'📝 '+(n.title||t('notes')),(n.body||'').slice(0,120))}}
    const push=(date,title,body)=>{if(date>now&&list.length<200)list.push({id:list.length+1,title,body,schedule:{at:date,allowWhileIdle:true},smallIcon:'ic_stat_name'})};
    for(const s of S.subs){const c=cust(s.customerId).name,sv=svc(s.serviceId).name;
      if(rd>0)push(at(s.end,rd),`⏳ ${sv}`,t('subExpAlert',{name:c,svc:sv,when:t('daysLeft',{n:rd})}));
      push(at(s.end,0),`⚠️ ${sv}`,t('subExpAlert',{name:c,svc:sv,when:t('today')}));}
    for(const a of S.accounts){if(!a.end)continue;const sv=svc(a.serviceId).name;
      if(rd>0)push(at(a.end,rd),`⏳ ${sv}`,t('accExpAlert',{svc:sv,acc:a.label,when:t('daysLeft',{n:rd})}));
      push(at(a.end,0),`⚠️ ${sv}`,t('accExpAlert',{svc:sv,acc:a.label,when:t('today')}));}
    list.forEach(n=>delete n.smallIcon);
    {const base=S.meta.lastShared||S.meta.firstRun||today();const d=parse(base);d.setDate(d.getDate()+7);d.setHours(hr,mn,0,0);if(d<=now){d.setTime(now.getTime());d.setDate(d.getDate()+1);d.setHours(hr,mn,0,0)}push(d,'📦 Raseed',t('backupNotif'))}
    if(list.length)await LN.schedule({notifications:list});
  }catch(e){console.warn(e)}
}
async function enableNotifs(){
  const C=Cap();
  if(C&&C.LocalNotifications){try{const r=await C.LocalNotifications.requestPermissions();if(r.display==='granted'){toast(t('notifOn'));doSchedule()}else toast('✗')}catch(e){toast(t('notifOff'))}return}
  try{if('Notification' in window){const r=await Notification.requestPermission();if(r==='granted'){toast(t('notifOn'));webNotify();return}}}catch(e){}
  toast(t('notifOff'));
}
function webNotify(){try{if(Cap()||!('Notification' in window)||Notification.permission!=='granted')return;const a=alerts();if(!a.length)return;const body=a.slice(0,3).map(x=>x.txt).join('\n');if(navigator.serviceWorker&&navigator.serviceWorker.controller){navigator.serviceWorker.ready.then(r=>r.showNotification(t('appName'),{body,icon:'icons/icon-192.png',tag:'raseed-daily'}));return}new Notification(t('appName'),{body:a.slice(0,3).map(x=>x.txt).join('\n')})}catch(e){}}

/* generic form builder */
const MONEY_KEYS=['price','paidNow','amount','cost','buy','sell'];
function altCur(){const st=S.settings,r=num(st.rate);if(!r)return null;if(st.currency==='$')return {sym:'ل.ل',main:'$',toMain:v=>Math.round(v/r*100)/100,toAlt:v=>Math.round(v*r),fmt:v=>Math.round(v).toLocaleString('en-US')+' ل.ل'};if(st.currency==='ل.ل'||st.currency==='LBP')return {sym:'$',main:st.currency,toMain:v=>Math.round(v*r),toAlt:v=>Math.round(v/r*100)/100,fmt:v=>'$'+v.toLocaleString('en-US',{maximumFractionDigits:2})};return null}
function field(f,val){
  if(f.money){const a=altCur();return `<div class="f" data-k="${f.k}"><label for="f_${f.k}">${esc(f.label)}${f.req?' *':''}</label><div class="money-in"><input id="f_${f.k}" name="${f.k}" type="number" inputmode="decimal" step="any" value="${esc(val)}"><select name="${f.k}__cur" data-cur="${f.k}"><option value="main">${esc(a.main)}</option><option value="alt">${esc(a.sym)}</option></select></div><div class="conv" data-conv="${f.k}"></div></div>`}
  const id='f_'+f.k;const lab=f.label?`<label for="${id}">${esc(f.label)}${f.req?' *':''}</label>`:'';
  if(f.type==='select')return `<div class="f" data-k="${f.k}">${lab}<select id="${id}" name="${f.k}">${f.options.map(o=>`<option value="${esc(o.v)}" ${String(o.v)===String(val)?'selected':''}>${esc(o.l)}</option>`).join('')}</select></div>`;
  if(f.type==='textarea')return `<div class="f" data-k="${f.k}">${lab}<textarea id="${id}" name="${f.k}">${esc(val)}</textarea></div>`;
  if(f.type==='toggle')return `<div class="f" data-k="${f.k}"><button type="button" class="tog" data-tog="${f.k}" style="width:100%"><span>${esc(f.label)}</span><span class="sw ${val?'on':''}"></span></button><input type="hidden" name="${f.k}" value="${val?1:''}"></div>`;
  if(f.type==='color')return `<div class="f" data-k="${f.k}">${lab}<div class="colors">${COLORS.map(c=>`<button type="button" data-col="${c}" class="${c===val?'on':''}" style="background:${c}"></button>`).join('')}</div><input type="hidden" name="${f.k}" value="${esc(val||COLORS[0])}"></div>`;
  return `<div class="f" data-k="${f.k}">${lab}<input id="${id}" name="${f.k}" type="${f.type||'text'}" ${f.type==='number'?'inputmode="decimal" step="any"':''} ${f.ph?`placeholder="${esc(f.ph)}"`:''} value="${esc(val)}"></div>`;
}
function formHTML(fields,data){let h='';for(let i=0;i<fields.length;i++){const f=fields[i];if(f.half&&fields[i+1]&&fields[i+1].half){h+=`<div class="row2">${field(f,data[f.k]??f.def??'')}${field(fields[i+1],data[fields[i+1].k]??fields[i+1].def??'')}</div>`;i++}else h+=field(f,data[f.k]??f.def??'')}return h}
function collect(root){const o={};root.querySelectorAll('[name]').forEach(el=>o[el.name]=el.value);return o}
function openForm({title,fields,data={},onSubmit,onDelete,onChange,note}){
  const AC=altCur();fields.forEach(f=>{f.money=!!(AC&&f.type==='number'&&MONEY_KEYS.includes(f.k))});
  openSheet(`<h2>${esc(title)}</h2>${note?`<div class="note">${note}</div>`:''}<form id="frm">${formHTML(fields,data)}<button class="btn" type="submit">${I('check')} ${t('save')}</button>${onDelete?`<button class="btn danger" type="button" id="frmDel">${I('trash')} ${t('delete')}</button>`:''}</form>`);
  const frm=document.getElementById('frm');
  frm.addEventListener('click',e=>{const tg=e.target.closest('[data-tog]');if(tg){const inp=frm.querySelector(`[name="${tg.dataset.tog}"]`);inp.value=inp.value?'':'1';tg.querySelector('.sw').classList.toggle('on',!!inp.value);onChange&&onChange(frm,tg.dataset.tog)}
    const cb=e.target.closest('[data-col]');if(cb){const w=cb.parentElement;w.querySelectorAll('button').forEach(b=>b.classList.remove('on'));cb.classList.add('on');w.nextElementSibling.value=cb.dataset.col}});
  const convUpd=k=>{const inp=frm.querySelector(`[name="${k}"]`),cs=frm.querySelector(`[name="${k}__cur"]`),out=frm.querySelector(`[data-conv="${k}"]`);if(!out)return;out.textContent=cs.value==='alt'&&inp.value!==''?t('convHint',{v:'\u2066'+money(AC.toMain(num(inp.value)))+'\u2069'}):''};
  frm.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.cur;if(k){const inp=frm.querySelector(`[name="${k}"]`);if(inp.value!==''){inp.value=e.target.value==='alt'?AC.toAlt(num(inp.value)):AC.toMain(num(inp.value))}convUpd(k)}});
  frm.addEventListener('input',e=>{if(e.target.name&&frm.querySelector(`[name="${e.target.name}__cur"]`))convUpd(e.target.name)});
  frm.addEventListener('change',e=>onChange&&onChange(frm,e.target.name));
  frm.onsubmit=e=>{e.preventDefault();const v=collect(frm);v.__orig={};fields.forEach(f=>{if(f.money&&v[f.k+'__cur']==='alt'&&v[f.k]!==''){v.__orig[f.k]=AC.fmt(num(v[f.k]));v[f.k]=String(AC.toMain(num(v[f.k])))}});const oN=k=>v.__orig[k]?` (${t('paidInAlt',{v:v.__orig[k]})})`:'';v.__note=oN;for(const f of fields){if(f.req&&!String(v[f.k]??'').trim()&&!frm.querySelector(`[data-k="${f.k}"]`).classList.contains('hidden')){toast(t('required'));return}}if(onSubmit(v,frm)!==false){save();closeSheet();render();toast(t('saved'))}};
  if(onDelete)document.getElementById('frmDel').onclick=()=>confirmBox(t('confirmDel'),()=>{onDelete();save();render();toast(t('deleted'))});
  onChange&&onChange(frm,'__init');
}
const durOpts=()=>[{v:'1',l:t('m1')},{v:'2',l:t('m2')},{v:'3',l:t('m3')},{v:'6',l:t('m6')},{v:'12',l:t('m12')},{v:'c',l:t('custom')}];
const svcOpts=(withNew)=>[...S.services.map(s=>({v:s.id,l:s.name})),...(withNew?[{v:'__newsvc',l:t('newService')}]:[])];
function newSvcFromForm(v){const name=(v.sName||'').trim();if(!name)return null;const o={id:uid(),name,unit:(v.sUnit||'').trim(),color:COLORS[S.services.length%COLORS.length]};S.services.push(o);return o.id}
function toggleNewSvc(frm){const on=frm.querySelector('[name=serviceId]').value==='__newsvc';const r=frm.querySelector('[data-k="sName"]').closest('.row2');r.classList.toggle('hidden',!on)}

/* ---- subscription form ---- */
function subForm(sub,preset={}){
  const isNew=!sub;sub=sub||{serviceId:preset.serviceId||UI.svcFilter!=='all'&&UI.svcFilter||S.services[0]?.id,customerId:preset.customerId||'',start:today(),dur:'1',qty:1,paid:'1',accountId:preset.accountId||''};
  if(preset.accountId){const a=acc(preset.accountId);if(a)sub.serviceId=a.serviceId}
  const custOpts=[{v:'',l:'—'},{v:'__new',l:t('newCustomer')},...[...S.customers].sort((a,b)=>a.name.localeCompare(b.name)).map(c=>({v:c.id,l:c.name}))];
  const fields=[
    {k:'customerId',label:t('customer'),type:'select',options:custOpts},
    {k:'cName',label:t('customerName'),half:true},{k:'cPhone',label:t('phone'),type:'tel',half:true},
    {k:'serviceId',label:t('service'),type:'select',options:svcOpts(true),half:true},
    {k:'accountId',label:t('fromAccount'),type:'select',options:[{v:'',l:t('none')}],half:true},
    {k:'sName',label:t('newServiceName'),half:true},{k:'sUnit',label:t('unit'),ph:t('unitPlaceholder'),half:true},
    {k:'qty',label:t('qty'),type:'number',half:true},{k:'price',label:t('price'),type:'number',req:true,half:true},
    {k:'start',label:t('start'),type:'date',half:true},{k:'dur',label:t('duration'),type:'select',options:durOpts(),half:true},
    {k:'end',label:t('end'),type:'date',req:true},
    ...(isNew?[{k:'paidNow',label:t('paidNow'),type:'number'}]:[]),
    {k:'notes',label:t('notes'),type:'textarea'}];
  const data={...sub,dur:isNew?'1':'c'};
  if(isNew)data.end=addMonths(sub.start,1);
  openForm({title:isNew?t('newSub'):t('editSub'),fields,data,
    onChange:(frm,k)=>{
      const g=n=>frm.querySelector(`[name="${n}"]`);
      const nc=g('customerId').value==='__new';
      frm.querySelector('[data-k="cName"]').closest('.row2').classList.toggle('hidden',!nc);
      toggleNewSvc(frm);
      if(k==='__init'||k==='serviceId'){const sid=g('serviceId').value;const accs=S.accounts.filter(a=>a.serviceId===sid);const cur=k==='__init'?sub.accountId:'';g('accountId').innerHTML=[`<option value="">${t('none')}</option>`,...accs.map(a=>`<option value="${a.id}" ${a.id===cur?'selected':''}>${esc(a.label)}${a.end?' · '+fmtDate(a.end):''}</option>`)].join('');frm.querySelector('[data-k="qty"] label').textContent=`${t('qty')} (${svc(sid).unit||'-'})`}
      if(k==='accountId'){const a=acc(g('accountId').value);if(a&&a.end){g('end').value=a.end;g('dur').value='c'}}
      if(k==='start'||k==='dur'){const d=g('dur').value;if(d!=='c'&&g('start').value)g('end').value=addMonths(g('start').value,+d)}
      if(k==='end')g('dur').value='c';
      if((k==='price'||k==='price__cur')&&isNew){const pc=g('price__cur'),nc=g('paidNow__cur');if(pc&&nc)nc.value=pc.value;g('paidNow').value=g('price').value}
    },
    onSubmit:v=>{
      let cid=v.customerId;
      if(cid==='__new'){if(!v.cName.trim()){toast(t('required'));return false}const c={id:uid(),name:v.cName.trim(),phone:v.cPhone.trim(),notes:''};S.customers.push(c);cid=c.id}
      if(!cid){toast(t('required'));return false}
      if(v.serviceId==='__newsvc'){const nid=newSvcFromForm(v);if(!nid){toast(t('required'));return false}v.serviceId=nid;v.accountId=''}
      const o={customerId:cid,serviceId:v.serviceId,accountId:v.accountId,qty:num(v.qty),price:num(v.price),start:v.start||today(),end:v.end,notes:v.notes};
      if(isNew){o.id=uid();o.charges=o.price;o.history=[{date:today(),start:o.start,end:o.end,price:o.price}];S.subs.push(o);const pn=Math.min(num(v.paidNow),o.price);if(pn>0)addTx('in',pn,'sub',`${cust(cid).name} · ${svc(o.serviceId).name}${v.__note('paidNow')}`,null,{ref:o.id,serviceId:o.serviceId})}
      else{const dp=o.price-num(sub.price);Object.assign(sub,o);sub.charges=chargesOf(sub)+dp}
    },
    onDelete:isNew?null:()=>{S.subs=S.subs.filter(x=>x.id!==sub.id)}
  });
}
function renewSub(s){
  openForm({title:`${t('renew')} — ${cust(s.customerId).name}`,note:`${svc(s.serviceId).name} · ${t('end')}: ${fmtDate(s.end)}${dueOf(s)>0?' · '+t('prevDebt',{v:money(dueOf(s))}):''}`,
    fields:[{k:'months',label:t('renewMonths'),type:'select',options:durOpts().filter(o=>o.v!=='c'),half:true},{k:'price',label:t('price'),type:'number',half:true},{k:'paidNow',label:t('paidNow'),type:'number'}],
    data:{months:'1',price:s.price,paidNow:num(s.price)},
    onSubmit:v=>{const base=daysLeft(s.end)>=0?s.end:today();const ns=daysLeft(s.end)>=0?s.start:today();s.end=addMonths(base,+v.months);s.start=ns;s.price=num(v.price);s.charges=chargesOf(s)+s.price;(s.history=s.history||[]).push({date:today(),start:base,end:s.end,price:s.price});const pn=num(v.paidNow);if(pn>0)addTx('in',pn,'sub',`${t('renew')} · ${cust(s.customerId).name} · ${svc(s.serviceId).name}${v.__note('paidNow')}`,null,{ref:s.id,serviceId:s.serviceId});setTimeout(()=>toast(t('renewed')),300)}});
}
function markPaid(s){
  const pays=S.tx.filter(x=>x.ref===s.id&&x.category==='sub').sort((a,b)=>b.date.localeCompare(a.date));
  openForm({title:`${t('addPayment')} — ${cust(s.customerId).name}`,
    note:`<div class="kv"><span>${t('charges')}</span><b class="ltr">${money(chargesOf(s))}</b></div><div class="kv"><span>${t('totalPaid')}</span><b class="ltr">${money(paidOf(s))}</b></div><div class="kv"><span>${t('remainingDue')}</span><b class="ltr" style="color:var(--bad)">${money(dueOf(s))}</b></div>
      <div style="margin-top:8px;font-weight:800;color:var(--text)">${t('payments')}</div>${pays.map(x=>`<div class="kv"><span>${fmtDate(x.date)}</span><b class="ltr">${money(x.amount)}</b></div>`).join('')||`<div>${t('noPayments')}</div>`}`,
    fields:[{k:'amount',label:t('amount'),type:'number',req:true,half:true},{k:'date',label:t('date'),type:'date',half:true}],
    data:{amount:dueOf(s),date:today()},
    onSubmit:v=>{const a=num(v.amount);if(a<=0)return false;addTx('in',a,'sub',`${t('payment')} · ${cust(s.customerId).name} · ${svc(s.serviceId).name}${v.__note('amount')}`,v.date,{ref:s.id,serviceId:s.serviceId})}})}

/* ---- account form ---- */
function accForm(a){
  const isNew=!a;a=a||{serviceId:UI.svcFilter!=='all'?UI.svcFilter:S.services[0]?.id,start:today(),deduct:1};
  openForm({title:isNew?t('newAccount'):t('editAccount'),
    fields:[{k:'serviceId',label:t('service'),type:'select',options:svcOpts(true),half:true},{k:'label',label:t('accLabel'),req:true,half:true},
      {k:'sName',label:t('newServiceName'),half:true},{k:'sUnit',label:t('unit'),ph:t('unitPlaceholder'),half:true},
      {k:'login',label:t('login')},
      {k:'start',label:t('start'),type:'date',half:true},{k:'dur',label:t('duration'),type:'select',options:durOpts(),half:true},
      {k:'end',label:t('end'),type:'date',req:true},
      {k:'cost',label:t('cost'),type:'number',half:true},{k:'capacity',label:t('capacity'),type:'number',half:true},
      ...(isNew?[{k:'deduct',label:t('deduct'),type:'toggle'}]:[]),
      {k:'notes',label:t('notes'),type:'textarea'}],
    data:{...a,dur:isNew?'1':'c',end:a.end||addMonths(a.start,1),deduct:a.deduct?1:''},
    onChange:(frm,k)=>{const g=n=>frm.querySelector(`[name="${n}"]`);toggleNewSvc(frm);
      if(k==='__init'||k==='serviceId')frm.querySelector('[data-k="capacity"] label').textContent=`${t('capacity')} (${svc(g('serviceId').value).unit||'-'})`;
      if(k==='start'||k==='dur'){const d=g('dur').value;if(d!=='c')g('end').value=addMonths(g('start').value,+d)}if(k==='end')g('dur').value='c'},
    onSubmit:v=>{if(v.serviceId==='__newsvc'){const nid=newSvcFromForm(v);if(!nid){toast(t('required'));return false}v.serviceId=nid}const o={serviceId:v.serviceId,label:v.label.trim(),login:v.login,start:v.start,end:v.end,cost:num(v.cost),capacity:num(v.capacity),notes:v.notes};
      if(isNew){o.id=uid();S.accounts.push(o);if(v.deduct&&o.cost>0)addTx('out',o.cost,'account',`${svc(o.serviceId).name} · ${o.label}`)}else Object.assign(a,o)},
    onDelete:isNew?null:()=>{S.accounts=S.accounts.filter(x=>x.id!==a.id);S.subs.forEach(s=>{if(s.accountId===a.id)s.accountId=''})}});
}
function renewAcc(a){
  openForm({title:`${t('renew')} — ${a.label}`,note:`${svc(a.serviceId).name} · ${t('end')}: ${fmtDate(a.end)}`,
    fields:[{k:'months',label:t('renewMonths'),type:'select',options:durOpts().filter(o=>o.v!=='c'),half:true},{k:'cost',label:t('cost'),type:'number',half:true},{k:'deduct',label:t('deduct'),type:'toggle'}],
    data:{months:'1',cost:a.cost,deduct:1},
    onSubmit:v=>{const base=daysLeft(a.end)>=0?a.end:today();a.start=base;a.end=addMonths(base,+v.months);a.cost=num(v.cost);if(v.deduct&&a.cost>0)addTx('out',a.cost,'account',`${t('renew')} · ${svc(a.serviceId).name} · ${a.label}`)}});
}

/* ---- customer ---- */
function custForm(c){const isNew=!c;c=c||{};
  openForm({title:isNew?t('addCustomer'):t('editCustomer'),fields:[{k:'name',label:t('customerName'),req:true},{k:'phone',label:t('phone'),type:'tel'},{k:'notes',label:t('notes'),type:'textarea'}],data:c,
    onSubmit:v=>{if(isNew)S.customers.push({id:uid(),name:v.name.trim(),phone:v.phone.trim(),notes:v.notes});else Object.assign(c,{name:v.name.trim(),phone:v.phone.trim(),notes:v.notes})},
    onDelete:isNew?null:()=>{S.customers=S.customers.filter(x=>x.id!==c.id);S.subs=S.subs.filter(s=>s.customerId!==c.id)}})}
function custDetail(c){
  const subs=S.subs.filter(s=>s.customerId===c.id).sort((a,b)=>b.end.localeCompare(a.end));
  const debt=subs.reduce((a,s)=>a+dueOf(s),0);
  const paidTot=subs.reduce((a,s)=>a+paidOf(s),0);
  openSheet(`<div style="display:flex;gap:12px;align-items:center;margin-bottom:14px"><div class="av" style="background:linear-gradient(135deg,var(--primary),var(--primary2));width:56px;height:56px;font-size:20px">${esc(initials(c.name))}</div><div style="flex:1"><h2 style="margin:0">${esc(c.name)}</h2><div class="st ltr" style="color:var(--muted);font-weight:600">${esc(c.phone||'')}</div></div></div>
  <div class="card" style="box-shadow:none"><div class="kv"><span>${t('subscriptions')}</span><b>${subs.length}</b></div><div class="kv"><span>${t('totalPaid')}</span><b class="ltr">${money(paidTot)}</b></div><div class="kv"><span>${t('debt')}</span><b class="ltr" style="color:${debt?'var(--bad)':'inherit'}">${money(debt)}</b></div>${c.notes?`<div class="kv"><span>${t('notes')}</span><b>${esc(c.notes)}</b></div>`:''}</div>
  <div class="mini-acts" style="margin-bottom:14px">${c.phone?`<a href="${waLink(c.phone,'')}" target="_blank" class="wa">${I('wa')} WhatsApp</a><a href="tel:${esc(c.phone)}">${I('phone')} ${t('call')}</a>`:''}<button id="cdEdit">${I('edit')} ${t('edit')}</button><button id="cdAdd">${I('plus')} ${t('addSub')}</button></div>
  <div id="cdSubs">${subs.map(subCard).join('')||`<div class="empty">${t('noData')}</div>`}</div>`);
  document.getElementById('cdEdit').onclick=()=>custForm(c);
  document.getElementById('cdAdd').onclick=()=>subForm(null,{customerId:c.id});
  bindSubActions(document.getElementById('cdSubs'));
}

/* ---- products ---- */
function prodForm(p){const isNew=!p;p=p||{stock:0,low:2};
  openForm({title:isNew?t('newProduct'):t('editProduct'),fields:[{k:'name',label:t('pname'),req:true},{k:'buy',label:t('buy'),type:'number',half:true},{k:'sell',label:t('sell'),type:'number',half:true},{k:'stock',label:t('stock'),type:'number',half:true},{k:'low',label:t('lowStock'),type:'number',half:true},...(isNew?[{k:'deduct',label:t('deduct'),type:'toggle'}]:[]),{k:'notes',label:t('notes'),type:'textarea'}],data:p,
    onSubmit:v=>{const o={name:v.name.trim(),buy:num(v.buy),sell:num(v.sell),stock:num(v.stock),low:num(v.low),notes:v.notes};if(isNew){o.id=uid();S.products.push(o);if(v.deduct&&o.buy*o.stock>0)addTx('out',o.buy*o.stock,'stock',`${o.name} ×${o.stock}`)}else Object.assign(p,o)},
    onDelete:isNew?null:()=>{S.products=S.products.filter(x=>x.id!==p.id)}})}
function sellForm(p){
  openForm({title:`${t('sellNow')} — ${p.name}`,note:`${t('stock')}: ${p.stock}`,fields:[{k:'qty',label:t('qty'),type:'number',half:true},{k:'price',label:t('sell'),type:'number',half:true},{k:'note',label:t('customer')}],data:{qty:1,price:p.sell},
    onSubmit:v=>{const q=num(v.qty);if(q<=0)return false;if(q>num(p.stock)){toast(t('outOfStock'));return false}p.stock=num(p.stock)-q;addTx('in',q*num(v.price),'sale',`${p.name} ×${q}${v.note?' · '+v.note:''}`,null,{costBasis:q*num(p.buy),productId:p.id})}})}
function restockForm(p){
  openForm({title:`${t('restock')} — ${p.name}`,fields:[{k:'qty',label:t('qty'),type:'number',half:true},{k:'buy',label:t('buy'),type:'number',half:true},{k:'deduct',label:t('deduct'),type:'toggle'}],data:{qty:1,buy:p.buy,deduct:1},
    onSubmit:v=>{const q=num(v.qty);if(q<=0)return false;p.stock=num(p.stock)+q;p.buy=num(v.buy);if(v.deduct)addTx('out',q*p.buy,'stock',`${p.name} ×${q}`)}})}

/* ---- transactions ---- */
function txForm(x,preType){const isNew=!x;const types=[{v:'expense',l:t('expense')},{v:'income',l:t('income')},{v:'deposit',l:t('deposit')},{v:'withdraw',l:t('withdraw')}];
  const cats=['expense','income','deposit','withdraw'];
  const data=x?{kind:cats.includes(x.category)?x.category:x.category,amount:x.amount,note:x.note,date:x.date}:{kind:preType||'expense',date:today()};
  const editable=!x||cats.includes(x.category);
  openForm({title:t('newTx'),fields:[...(editable?[{k:'kind',label:t('type'),type:'select',options:types}]:[]),{k:'amount',label:t('amount'),type:'number',req:true,half:true},{k:'date',label:t('date'),type:'date',half:true},{k:'note',label:t('notes')}],data,
    onSubmit:v=>{const kind=editable?v.kind:x.category;const type=(kind==='income'||kind==='deposit')?'in':(kind==='expense'||kind==='withdraw')?'out':x.type;if(isNew)addTx(type,v.amount,kind,(v.note||'')+v.__note('amount'),v.date);else Object.assign(x,{type,category:kind,amount:num(v.amount),note:v.note,date:v.date})},
    onDelete:isNew?null:()=>{S.tx=S.tx.filter(y=>y.id!==x.id)}})}

/* ---- services ---- */

async function hash(str){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 'f'+(h2>>>0).toString(16)+(h1>>>0).toString(16)}}
const normAns=x=>String(x||'').trim().toLowerCase().replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ');
const normCode=x=>String(x||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function rnd(n,al){const a=new Uint32Array(n);try{crypto.getRandomValues(a)}catch(e){for(let i=0;i<n;i++)a[i]=Math.random()*4294967296}return [...a].map(x=>al[x%al.length]).join('')}
const genCode=()=>{const c=rnd(8,'ABCDEFGHJKLMNPQRSTUVWXYZ23456789');return c.slice(0,4)+'-'+c.slice(4)};
const lockEl=document.getElementById('lock');let locked=false,fails=0,blockedUntil=0,hiddenAt=0;
function pinPad({title,sub='',mode='auto',len=4,onSubmit,forgot=false,cancel=null,bio=false,startBio=false,clock=false}){

  const pinView=()=>{pin='';
  lockEl.innerHTML=`<div class="lock-in">${head}<h2>${esc(title)}</h2><p id="lkSub">${esc(sub)}</p><div class="dots" id="dots"></div>
   <div class="keys">${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-d="${d}">${d}</button>`).join('')}
   ${bio?`<button class="ic-k" id="lkBio" aria-label="fingerprint" style="color:var(--primary2)">${I('finger')}</button>`:forgot?`<button class="ghost" id="lkForgot">${t('forgot')}</button>`:mode==='free'?`<button id="lkOk" style="background:var(--primary);color:#fff;border:0">${I('check')}</button>`:'<span></span>'}
   <button data-d="0">0</button><button class="ic-k" id="lkDel" aria-label="delete">${I('back')}</button></div>
   ${bio&&forgot?`<button class="lk-link" id="lkForgot2">${t('forgot')}</button>`:''}

  const dots=document.getElementById('dots');
  const draw=()=>{dots.innerHTML=[...Array(mode==='auto'?len:Math.max(4,pin.length))].map((_,i)=>`<i class="${i<pin.length?'on':''}"></i>`).join('')};draw();
  const fail=()=>{dots.classList.remove('shake');void dots.offsetWidth;dots.classList.add('shake');try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}pin='';draw()};
  const submit=()=>Promise.resolve(onSubmit(pin)).then(ok=>{if(ok===false)fail()});
  lockEl.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(Date.now()<blockedUntil){document.getElementById('lkSub').textContent=t('tooMany',{n:Math.ceil((blockedUntil-Date.now())/1000)});return}if(pin.length>=max)return;pin+=b.dataset.d;draw();if(mode==='auto'&&pin.length===len)setTimeout(submit,120)});
  document.getElementById('lkDel').onclick=()=>{pin=pin.slice(0,-1);draw()};
  const ok=document.getElementById('lkOk');if(ok)ok.onclick=()=>{if(pin.length<4){fail();return}submit()};

function periodMonths(){const now=new Date();let n=UI.rp==='12'?12:UI.rp==='y'?now.getMonth()+1:6;const out=[];for(let i=n-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);out.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}`)}return out}

function niceMax(v){if(v<=0)return 10;const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function viewReports(){UI.rp=UI.rp||'6';const months=periodMonths();const stats=months.map(m=>({m,...monthStats(m)}));
  const tot=stats.reduce((a,x)=>({rev:a.rev+x.rev,cost:a.cost+x.cost,net:a.net+x.net}),{rev:0,cost:0,net:0});
  const first=months[0];const [fy,fm]=first.split('-').map(Number);const prevMs=months.map((_,i)=>{const d=new Date(fy,fm-1-months.length+i,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`});
  const prev=prevMs.map(monthStats).reduce((a,x)=>({rev:a.rev+x.rev,net:a.net+x.net}),{rev:0,net:0});
  const delta=(c,p)=>{if(!p)return '';const d=Math.round((c-p)/Math.abs(p)*100);return `<span class="delta" style="color:${d>=0?'var(--ok)':'var(--bad)'}">${d>=0?'▲':'▼'} ${Math.abs(d)}%</span> <span style="font-size:11px;color:var(--muted)">${t('vsPrev')}</span>`};
  const chips=`<div class="chips">${[['6',t('m6r')],['12',t('m12r')],['y',t('thisYear')]].map(([k,l])=>`<button data-rp="${k}" class="${UI.rp===k?'on':''}" style="${UI.rp===k?'background:var(--text);color:var(--bg)':''}">${l}</button>`).join('')}</div>`;

  // grouped bar chart
  const VW=340,VH=190,pl=4,pr=4,pt=10,pb=24,ph=VH-pt-pb,pw=VW-pl-pr;const mx=niceMax(Math.max(...stats.map(x=>Math.max(x.rev,x.cost)),0));

  const empty_=!tot.rev&&!tot.cost?`<div class="empty">${I('report')}<div>${t('noReport')}</div></div>`:'';
  UI._rStats=stats;

}

function cleanPlan(o){const cut=addMonths(today(),-o.months);
  const subs=o.subs?S.subs.filter(s=>s.end<cut&&dueOf(s)<=0):[];const subIds=new Set(subs.map(s=>s.id));
  const keptSubIds=new Set(S.subs.filter(s=>!subIds.has(s.id)).map(s=>s.id));
  const tx=o.tx?S.tx.filter(x=>x.date<cut&&x.category!=='carry'&&!(x.ref&&keptSubIds.has(x.ref))):[];
  const keptSubsAfter=S.subs.filter(s=>!subIds.has(s.id));
  const acc=o.acc?S.accounts.filter(a=>a.end&&a.end<cut&&!keptSubsAfter.some(s=>s.accountId===a.id)):[];
  const notes=o.notes?S.notes.filter(n=>!n.pinned&&(n.updated||0)<parse(cut).getTime()):[];
  const cust=o.cust?S.customers.filter(c=>!keptSubsAfter.some(s=>s.customerId===c.id)):[];
  return {cut,subs,tx,acc,notes,cust,total:subs.length+tx.length+acc.length+notes.length+cust.length}}

  openSheet(`<h2>${I('trash','width=22 height=22')} ${t('cleanup')}</h2><div class="note">${t('cleanIntro')}${size?`<div style="margin-top:6px">📦 ${t('dataSize',{v:'<bdi dir="ltr">'+size+'</bdi>'})} · <bdi>${S.subs.length+S.tx.length+S.customers.length+S.notes.length}</bdi> ${t('items')}</div>`:''}</div>
   <label style="display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px">${t('olderThan')}</label>
   <div class="seg">${[[3,'mo3'],[6,'mo6'],[12,'mo12'],[24,'mo24']].map(([m,k])=>`<button data-mo="${m}" class="${o.months===m?'on':''}">${t(k)}</button>`).join('')}</div>
   <div class="hint">📅 ${fmtDate(pl.cut)}</div>
   ${tg('subs',t('cl_subs'),pl.subs.length)}${tg('tx',t('cl_tx'),pl.tx.length)}${tg('acc',t('cl_acc'),pl.acc.length)}${tg('notes',t('cl_notes'),pl.notes.length)}${tg('cust',t('cl_cust'),pl.cust.length)}
   <div class="hint" style="margin-top:4px">🛡️ ${t('cl_keep')}</div>
   ${pl.total?`<div class="note" style="color:var(--text)">⚠️ ${t('cl_preview')}: <b>${pl.total}</b> ${t('items')}.<br>${pl.tx.length?t('cl_reports')+'<br>':''}${t('cl_partner')}</div>
     <button class="btn ghost" id="clBk">${I('up')} ${t('cl_backupFirst')}</button><button class="btn danger" id="clGo">${I('trash')} ${t('cl_do')} (${pl.total})</button>`:`<div class="empty" style="padding:16px">${t('cl_none')}</div>`}
   ${hasUndo?`<button class="btn ghost" id="clUndo" style="margin-top:8px">${I('renew')} ${t('cl_undo')}</button>`:''}`);
  sb.querySelectorAll('[data-mo]').forEach(b=>b.onclick=()=>{o.months=+b.dataset.mo;openCleanup()});
  sb.querySelectorAll('[data-cl]').forEach(b=>b.onclick=()=>{o[b.dataset.cl]=o[b.dataset.cl]?0:1;openCleanup()});

    const sI=rm(pl.subs),tI=rm(pl.tx),aI=rm(pl.acc),nI=rm(pl.notes),cI=rm(pl.cust);

    S.subs=S.subs.filter(r=>!sI.has(r.id));S.tx=S.tx.filter(r=>!tI.has(r.id));S.accounts=S.accounts.filter(r=>!aI.has(r.id));S.notes=S.notes.filter(r=>!nI.has(r.id));S.customers=S.customers.filter(r=>!cI.has(r.id));
    if(Math.abs(net)>0.0001){const d=new Date(parse(pl.cut));d.setDate(d.getDate()-1);addTx(net>=0?'in':'out',Math.abs(Math.round(net*100)/100),'carry',t('carryNote',{d:fmtDate(ymd(d))}),ymd(d))}

const normPhone=p=>{let d=String(p||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('961'))d=d.slice(3);return d.replace(/^0+/,'')};
function mergeInto(T,inc){const st={};const del={...(T.deleted||{})};for(const id in (inc.deleted||{}))del[id]=Math.max(del[id]||0,inc.deleted[id]);
  for(const c of COLLS){const a={add:0,upd:0,del:0};const map=new Map((T[c]||[]).map(r=>[r.id,r]));
    for(const r of inc[c]||[]){if(!r||!r.id)continue;if(del[r.id]&&del[r.id]>=(r.u||0))continue;const ex=map.get(r.id);if(!ex){map.set(r.id,r);a.add++}else if((r.u||0)>(ex.u||0)&&sig(r)!==sig(ex)){map.set(r.id,r);a.upd++}}
    for(const [id,r] of map)if(del[id]&&del[id]>=(r.u||0)){map.delete(id);a.del++}
    T[c]=[...map.values()];st[c]=a}
  T.deleted=del;const now=Date.now();
  // same service name -> one service
  const byName={};for(const x of [...T.services]){const k=x.name.trim().toLowerCase();if(byName[k]&&byName[k]!==x.id){const keep=byName[k];for(const r of [...T.subs,...T.accounts,...T.tx])if(r.serviceId===x.id){r.serviceId=keep;r.u=now}T.services=T.services.filter(y=>y.id!==x.id);del[x.id]=now;st.services.add=Math.max(0,st.services.add-1)}else byName[k]=x.id}
  // same phone -> one customer
  const byPh={};for(const x of [...T.customers]){const k=normPhone(x.phone);if(k.length<6)continue;if(byPh[k]&&byPh[k]!==x.id){const keep=byPh[k];for(const r of T.subs)if(r.customerId===x.id){r.customerId=keep;r.u=now}T.customers=T.customers.filter(y=>y.id!==x.id);del[x.id]=now;st.customers.add=Math.max(0,st.customers.add-1)}else byPh[k]=x.id}
  return st}
function mergePreview(inc){let st;try{const clone=JSON.parse(JSON.stringify(S));st=mergeInto(clone,inc)}catch(e){toast(t('badFile'));return}

  document.getElementById('doMerge').onclick=()=>{try{localStorage.setItem('raseed_premerge',JSON.stringify(S))}catch(e){}track();mergeInto(S,inc);snapshot();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}scheduleNotifs();closeSheet();render(true);toast(t('merged'))}}

   <div class="card" style="box-shadow:none;padding:4px 12px">${rows.map(r=>{const k=tp.id+':'+r.key;const sent=S.sent[k]===today();const href=r.c.phone?waLink(r.c.phone,fillTpl(tplText(tp),r.s,r.c)):'';
     return `<div class="camp"><div class="av" style="background:${r.s?svc(r.s.serviceId).color:'var(--muted)'};width:38px;height:38px;font-size:14px">${esc(initials(r.c.name))}</div><div class="mid"><div class="t">${esc(r.c.name)}</div><div class="st">${esc(r.info)}</div></div>
      ${!r.c.phone?`<span class="chip c-mut">${t('noPhone')}</span>`:`<a data-sk="${esc(k)}" target="_blank" class="${sent?'sent':''}" href="${href}">${sent?t('sentToday'):I('wa','width=15 height=15 style="vertical-align:-3px"')+' '+t('send')}</a>`}</div>`}).join('')||`<div class="empty">${t('noData')}</div>`}</div>
   ${rows.length?`<button class="btn ghost" id="cpList">${I('copy')} ${t('copyList')}</button>`:''}`);
  document.getElementById('sdTpl').onchange=e=>openSend(e.target.value,mode);
  sb.querySelectorAll('[data-sm]').forEach(b=>b.onclick=()=>openSend(tp.id,b.dataset.sm));
  sb.querySelectorAll('[data-sk]').forEach(a=>a.addEventListener('click',()=>{S.sent[a.dataset.sk]=today();save();setTimeout(()=>{a.className='sent';a.textContent=t('sentToday')},300)}));
  const cp=document.getElementById('cpList');if(cp)cp.onclick=async()=>{const txt=rows.map(r=>`${r.c.name} — ${r.info}${r.c.phone?' — '+r.c.phone:''}`).join('\n');try{await navigator.clipboard.writeText(txt);toast(t('copied'))}catch(e){toast('✗')}};
}

/* ============ SERVICES PAGE ============ */
function viewServices(){const m=today().slice(0,7);
  return S.services.map((x,i)=>{const act=S.subs.filter(s=>s.serviceId===x.id&&status(s.end)!=='expired');const accs=S.accounts.filter(a=>a.serviceId===x.id).length;
    const rev=S.tx.filter(tx=>tx.category==='sub'&&tx.type==='in'&&tx.date.slice(0,7)===m&&(tx.serviceId||(S.subs.find(s=>s.id===tx.ref)||{}).serviceId)===x.id).reduce((a,tx)=>a+tx.amount,0);
    return `<div class="card" style="border-inline-start:4px solid ${x.color}"><div class="svc-pg"><div class="av" style="background:${x.color};width:50px;height:50px">${esc(initials(x.name))}</div>
      <div style="flex:1;min-width:0"><div style="font-weight:800;font-size:16px">${esc(x.name)} <span class="chip c-mut">${esc(x.unit||'—')}</span></div>
      <div class="nums"><span><b>${new Set(act.map(s=>s.customerId)).size}</b> ${t('activeCustN')}</span><span><b>${accs}</b> ${t('accountsN')}</span><span><b class="ltr">${money(rev)}</b> ${t('monthRevN')}</span></div></div>
      <div class="ord"><button data-up="${i}" ${i===0?'disabled style="opacity:.3"':''} aria-label="up">${I('chevU')}</button><button data-dn="${i}" ${i===S.services.length-1?'disabled style="opacity:.3"':''} aria-label="down">${I('chevD')}</button></div></div>
      <div class="mini-acts"><button data-se="${x.id}">${I('edit')} ${t('edit')}</button><button data-ss="${x.id}">${I('subs')} ${t('subs')}</button><button data-sa="${x.id}">${I('plus')} ${t('account')}</button></div></div>`}).join('')
   +`<button class="btn ghost" data-addsvc style="border-style:dashed;color:var(--primary)">${I('plus')} ${t('addService')}</button>`}
function bindServices(){const mv=(i,d)=>{const a=S.services;[a[i],a[i+d]]=[a[i+d],a[i]];save();render()};
  document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>mv(+b.dataset.up,-1));document.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>mv(+b.dataset.dn,1));
  document.querySelectorAll('[data-se]').forEach(b=>b.onclick=()=>svcForm(S.services.find(x=>x.id===b.dataset.se)));
  document.querySelectorAll('[data-ss]').forEach(b=>b.onclick=()=>{UI.svcFilter=b.dataset.ss;UI.subSeg='subs';UI.prevTab='home';UI.tab='subs';window.scrollTo(0,0);render(true)});
  document.querySelectorAll('[data-sa]').forEach(b=>b.onclick=()=>{UI.svcFilter=b.dataset.sa;accForm()})}

/* ============ RENDER ============ */
const TABS=[['home','home'],['subs','subs'],['customers','users'],['products','box'],['wallet','wallet'],['notes','note']];
function applyChrome(){
  document.documentElement.lang=S.settings.lang;document.documentElement.dir=S.settings.lang==='ar'?'rtl':'ltr';
  document.documentElement.dataset.theme=S.settings.theme;
  document.querySelector('meta[name=theme-color]').content=S.settings.theme==='light'?'#f3f4fb':'#0b0d17';
  {const C=Cap();if(C&&C.StatusBar){const lt=S.settings.theme==='light';try{C.StatusBar.setBackgroundColor({color:lt?'#f3f4fb':'#0b0d17'}).catch(()=>{});C.StatusBar.setStyle({style:lt?'LIGHT':'DARK'}).catch(()=>{})}catch(e){}}}
  document.getElementById('setBtn').innerHTML=I('menu');document.getElementById('backBtn').innerHTML=I(S.settings.lang==='ar'?'arrowR':'arrowL');document.getElementById('logoTop').innerHTML=LOGO;document.getElementById('toTop').innerHTML=I('arrowUp');document.getElementById('sheetX').innerHTML=I('x');
  document.getElementById('fab').innerHTML=I('plus');
  document.title=t('appName');
}
function render(anim){
  const n=alerts().length;
  document.getElementById('bellBtn').innerHTML=I('bell')+(n?`<span class="badge">${n}</span>`:'');
  document.getElementById('hello').textContent=UI.tab==='home'?t('hello'):t('appName');
  document.getElementById('title').textContent=UI.tab==='home'?t('appName'):t(UI.tab);
  document.getElementById('nav').innerHTML=TABS.map(([k,ic])=>`<button data-tab="${k}" class="${UI.tab===k?'on':''}">${I(ic)}<span>${t('nav_'+k)}</span></button>`).join('');
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{if(UI.tab!==b.dataset.tab){UI.tab=b.dataset.tab;UI.q='';if(UI.tab==='subs')UI.statusFilter='all';window.scrollTo({top:0,behavior:'instant'});render(true)}});
  const v=document.getElementById('view');
  if(UI.tab==='home'){v.innerHTML=viewHome();bindHome()}
  if(UI.tab==='subs'){v.innerHTML=viewSubs();bindSubs()}
  if(UI.tab==='customers'){v.innerHTML=viewCustomers();bindCustomers()}
  if(UI.tab==='products'){v.innerHTML=viewProducts();bindProducts()}
  if(UI.tab==='wallet'){v.innerHTML=viewWallet();bindWallet()}
  if(UI.tab==='notes'){v.innerHTML=viewNotes();bindNotes()}
  if(UI.tab==='messages'){v.innerHTML=viewMessages();bindMessages()}
  if(UI.tab==='services'){v.innerHTML=viewServices();bindServices()}
  {const ex=EXTRA.includes(UI.tab);document.getElementById('backBtn').classList.toggle('hidden',!ex);document.getElementById('logoTop').classList.toggle('hidden',ex)}
  document.querySelectorAll('[data-addsvc]').forEach(b=>b.onclick=e=>{e.stopPropagation();svcForm()});
  document.querySelectorAll('[data-camp]').forEach(b=>b.onclick=()=>openCampaign());
  document.querySelectorAll('[data-bk]').forEach(b=>b.onclick=()=>exportData());
  document.querySelectorAll('[data-iosx]').forEach(b=>b.onclick=()=>{UI.hideIos=true;render()});
  if(anim){v.classList.remove('anim');void v.offsetWidth;v.classList.add('anim');clearTimeout(render._a);render._a=setTimeout(()=>v.classList.remove('anim'),900)}
}
document.getElementById('fab').onclick=()=>{const tb=UI.tab;if(tb==='customers')custForm();else if(tb==='products')prodForm();else if(tb==='wallet')txForm();else if(tb==='notes')noteForm();else if(tb==='messages')tplForm();else if(tb==='services')svcForm();else if(tb==='subs'&&UI.subSeg==='accounts')accForm();else subForm()};
document.getElementById('setBtn').onclick=openMenu;document.getElementById('backBtn').onclick=goBack;
document.getElementById('bellBtn').onclick=openAlerts;

/* Android back button */
(function(){const C=Cap();if(C&&C.App)C.App.addListener('backButton',()=>{if(sheet.classList.contains('on'))closeSheet();else if(!lockEl.classList.contains('hidden')){if(locked)C.App.minimizeApp?C.App.minimizeApp():C.App.exitApp();else{hideLock();openSettings()}}else if(EXTRA.includes(UI.tab))goBack();else if(UI.tab!=='home'){UI.tab='home';render()}else C.App.exitApp()})})();
/* native status bar */
(function(){const C=Cap();if(C&&C.LocalNotifications){C.LocalNotifications.checkPermissions().then(p=>{if(p.display==='prompt')C.LocalNotifications.requestPermissions().then(doSchedule)}).catch(()=>{})}})();

(function(){if(Cap())return;try{if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}})();
if(!S.meta.firstRun){S.meta.firstRun=today();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
applyChrome();render(true);scheduleNotifs();setTimeout(autoBackup,2500);if(S.security.enabled)showLock();else setTimeout(webNotify,1500);
/* scroll effects */
(function(){const top=document.getElementById('top'),tt=document.getElementById('toTop');let tk=false;
  window.addEventListener('scroll',()=>{if(tk)return;tk=true;requestAnimationFrame(()=>{const y=window.scrollY;top.classList.toggle('scrolled',y>8);tt.classList.toggle('on',y>600);tk=false})},{passive:true});
  tt.onclick=()=>window.scrollTo({top:0,behavior:'smooth'})})();
</script>
</body>
</html>
